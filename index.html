<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Groningen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Baloo+2:wght@700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0e1528;--card:#161d33;--text:#ffffff;--text-sub:#c0c8e0;--text-dim:#6b7599;
    --accent:#38bdf8;--accent2:#a78bfa;--warm:#fbbf24;--coral:#fb7185;
    --glass:rgba(16,22,42,0.82);--border:rgba(255,255,255,0.08);
    --grad-sky:linear-gradient(135deg,#1e3a5f 0%,#0e1528 100%);
    --ff-body:'Nunito',sans-serif;
    --ff-display:'Baloo 2',cursive,sans-serif;
    --ff-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ff-body);-webkit-font-smoothing:antialiased}

  #loader{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
  #loader.done{opacity:0;visibility:hidden;pointer-events:none}
  .ld-icon{font-size:13vw;margin-bottom:2vh;animation:bounce 1.5s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5vh) scale(1.1)}}
  .ld-city{font-family:var(--ff-display);font-size:8vw;font-weight:800;margin-bottom:1vh;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ld-sub{font-size:2.6vw;color:var(--text-dim);letter-spacing:.1em;font-weight:600}
  .ld-spin{width:6vw;height:6vw;border:.6vw solid rgba(255,255,255,.08);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-top:3vh}
  @keyframes spin{to{transform:rotate(360deg)}}

  #app{width:100vw;height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity .8s}
  #app.show{opacity:1}

  /* Photo */
  .photo{flex-shrink:0;position:relative;width:100%;height:46%;overflow:hidden;background:var(--card);border-radius:0 0 3vw 3vw}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%;animation:drift 25s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.03) translate(-.3%,-.2%)}}
  .photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(14,21,40,0) 0%,
      rgba(14,21,40,.15) 40%,
      rgba(14,21,40,.85) 85%,
      rgba(14,21,40,1) 100%
    );
    pointer-events:none;
    border-radius:0 0 3vw 3vw;
  }

  .current{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:0 6vw 4vh;display:flex;align-items:flex-end;justify-content:space-between}
  .cur-left{display:flex;flex-direction:column}
  .cur-loc{
    font-size:2.6vw;font-weight:700;
    text-transform:uppercase;letter-spacing:.25em;
    color:var(--accent);margin-bottom:1vh;
  }
  .cur-temp{font-size:23vw;font-weight:300;line-height:.85;letter-spacing:-.04em}
  .cur-temp sup{font-size:.25em;font-weight:400;color:var(--text-sub);vertical-align:top;margin-left:.08em}
  .cur-desc{
    font-size:4.6vw;font-weight:600;
    color:var(--text-sub);margin-top:1.2vh;
    text-transform:capitalize;
  }

  .cur-right{display:flex;flex-direction:column;align-items:flex-end;gap:2vh}
  .cur-icon{font-size:17vw;line-height:1;filter:drop-shadow(0 .8vh 4vh rgba(56,189,248,.25))}
  .cur-detail{
    display:flex;align-items:center;gap:1.4vw;
    font-size:2.7vw;color:var(--text-sub);
    font-weight:600;letter-spacing:.03em;
  }
  .cur-detail svg{width:3vw;height:3vw;opacity:.6}

  /* Info pills */
  .info-row{
    flex-shrink:0;
    display:flex;gap:2vw;
    padding:3vh 5vw;
    overflow-x:hidden;
  }
  .info-pill{
    flex:1;
    display:flex;flex-direction:column;align-items:center;
    gap:.8vh;
    padding:2.4vh 1vw;
    background:linear-gradient(135deg,rgba(56,189,248,.08),rgba(167,139,250,.06));
    border:.15vw solid rgba(56,189,248,.12);
    border-radius:2.4vw;
  }
  .info-label{font-size:2vw;color:var(--text-dim);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  .info-val{font-size:4.6vw;font-weight:800}
  .info-unit{font-size:.55em;font-weight:400;color:var(--text-sub)}

  /* Hourly */
  .hourly-section{flex:1;display:flex;flex-direction:column;padding:3vh 5vw 0;overflow:hidden}
  .hourly-header{
    display:flex;align-items:center;gap:2vw;
    margin-bottom:2.4vh;flex-shrink:0;
  }
  .hourly-title{font-size:2.6vw;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:var(--text-dim)}
  .hourly-line{flex:1;height:.15vh;background:var(--border)}

  .hourly-scroll{flex:1;display:flex;gap:2vw;overflow-x:hidden}
  .hour-card{
    flex:0 0 calc((100% - 10vw) / 6);
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;
    gap:1.4vh;
    padding:2vh 0;
    background:rgba(255,255,255,.03);
    border:.15vw solid var(--border);
    border-radius:2.4vw;
    transition:all .3s;
  }
  .hour-card.now{
    background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(167,139,250,.08));
    border-color:rgba(56,189,248,.25);
    box-shadow:0 0 4vh rgba(56,189,248,.08);
  }
  .hour-time{font-size:2.7vw;color:var(--text-dim);font-weight:700;letter-spacing:.05em}
  .hour-icon{font-size:8.5vw;line-height:1}
  .hour-temp{font-size:4.6vw;font-weight:800}
  .hour-rain{font-size:2.4vw;color:var(--accent);font-family:var(--ff-mono);font-weight:400}

  /* Bottom */
  .bottom{
    flex-shrink:0;height:7vh;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 5vw;
    background:var(--glass);border-top:.15vw solid var(--border);
  }
  .bottom-source{font-size:2vw;color:var(--text-dim);font-family:var(--ff-mono);letter-spacing:.04em}
  .bottom-clock{
    font-size:5vw !important;
    font-weight:800 !important;
    color:#ffffff !important;
    font-family:var(--ff-mono);
    letter-spacing:.08em;
    text-shadow:0 0 4vh rgba(56,189,248,.2);
  }
</style>
</head>
<body>

<div id="loader">
  <div class="ld-icon">⛅</div>
  <div class="ld-city">Groningen</div>
  <div class="ld-sub">Loading weather data…</div>
  <div class="ld-spin"></div>
</div>

<div id="app">
  <div class="photo">
    <img id="bgPhoto" src="" alt="">
    <div class="current">
      <div class="cur-left">
        <div class="cur-loc">Groningen, Netherlands</div>
        <div class="cur-temp" id="curTemp">--<sup>°C</sup></div>
        <div class="cur-desc" id="curDesc">--</div>
      </div>
      <div class="cur-right">
        <div class="cur-icon" id="curIcon">🌤</div>
        <div class="cur-detail">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12M10 4l4 4-4 4"/></svg>
          <span id="curWind">-- km/h</span>
        </div>
        <div class="cur-detail">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2C8 2 3 7 3 10a5 5 0 0010 0c0-3-5-8-5-8z"/></svg>
          <span id="curHumidity">--%</span>
        </div>
      </div>
    </div>
  </div>

  <div class="info-row">
    <div class="info-pill"><span class="info-label">Feels like</span><span class="info-val" id="feelsLike">--<span class="info-unit">°</span></span></div>
    <div class="info-pill"><span class="info-label">UV</span><span class="info-val" id="uvIndex">--</span></div>
    <div class="info-pill"><span class="info-label">Pressure</span><span class="info-val" id="pressure">--<span class="info-unit">hPa</span></span></div>
    <div class="info-pill"><span class="info-label">Wind</span><span class="info-val" id="windDir">--</span></div>
  </div>

  <div class="hourly-section">
    <div class="hourly-header">
      <div class="hourly-title">Upcoming Hours</div>
      <div class="hourly-line"></div>
    </div>
    <div class="hourly-scroll" id="hourlyScroll"></div>
  </div>

  <div class="bottom">
    <span class="bottom-source">Open-Meteo · Updated <span id="updateTime">--:--</span></span>
    <div class="bottom-clock" id="clock">--:--:--</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const LAT=53.2194, LON=6.5665;
  const $=id=>document.getElementById(id);

  function clock(){const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
  clock();setInterval(clock,1000);

  // ── Curated sharp, high-res photos per weather (Unsplash CDN direct) ──
  const U = (id, extra='') => `https://images.unsplash.com/photo-${id}?w=2560&h=1440&fit=crop&auto=format%2Ccompress&q=90${extra}`;
  const PHOTOS = {
    clear_day: [
      U('1506905925346-21bda4d32df4'),           // golden sunlight field
      U('1470252649378-9c29740c9fa8'),           // bright blue sky green landscape
      U('1500382017468-9049fed747ef'),           // warm sunshine meadow
      U('1507525428034-b723cf961d3e'),           // vibrant summer sky
    ],
    clear_night: [
      U('1519681393784-d120267933ba'),           // starry night sky milky way
      U('1444703686981-a3abbc4d4fe3'),           // night stars clear sky
      U('1532978379173-523e16f371f2'),           // deep blue night sky
    ],
    cloudy_day: [
      U('1501630834273-4b5604d2ee31','&crop=entropy'), // dramatic clouds with light
      U('1499956827185-0d63ee78a910'),           // soft cloud landscape
      U('1469365556835-3da3db4c253b'),           // rolling clouds sunshine
    ],
    cloudy_night: [
      U('1513628253939-010e64ac66cd'),           // moody night clouds
      U('1501511795728-df99c6904cef'),           // dark clouds night
    ],
    rain_day: [
      U('1428592097671-29a5b7039748'),           // rain on window
      U('1534274988757-a28bf1a57c17'),           // dramatic rain sky
      U('1433863448220-78aaa30afae7'),           // rain drops fresh
    ],
    rain_night: [
      U('1501999635878-71cb5379c2d8'),           // rainy night city lights
      U('1415459340527-0e1f3a1eb947'),           // dark rain atmosphere
    ],
    snow_day: [
      U('1491002052546-bf38f186af56'),           // bright snow landscape
      U('1418985991508-e47386d96a71'),           // fresh snow scene
      U('1477601263568-180e2c6d046e'),           // snowy trees sunshine
    ],
    snow_night: [
      U('1548266652-99cf27701ced'),              // snowy night scene
      U('1482841628122-9080d44bb807'),           // night snowfall
    ],
    fog: [
      U('1487621167305-5d248087c724'),           // foggy forest morning
      U('1543968996-ee822b8176ba'),              // misty landscape
      U('1485236715568-ddc5ee6ca227'),           // atmospheric fog
    ],
    storm: [
      U('1461511669078-d46bf351cd6e'),           // lightning dramatic
      U('1429552077091-836152271555'),           // thunderstorm sky
      U('1472145246862-b24cf25c4a36'),           // storm clouds dramatic
    ],
  };

  function pickPhoto(key){const l=PHOTOS[key]||PHOTOS.cloudy_day;return l[new Date().getHours()%l.length]}

  function getPhotoKey(code,isDay){
    if(code>=95) return 'storm';
    if((code>=71&&code<=77)||(code>=85&&code<=86)) return isDay?'snow_day':'snow_night';
    if((code>=51&&code<=67)||(code>=80&&code<=82)) return isDay?'rain_day':'rain_night';
    if(code===45||code===48) return 'fog';
    if(code>=2) return isDay?'cloudy_day':'cloudy_night';
    return isDay?'clear_day':'clear_night';
  }

  const WMO={
    0:{d:'Clear sky',i:'☀️',n:'🌙'},1:{d:'Mainly clear',i:'🌤️',n:'🌙'},
    2:{d:'Partly cloudy',i:'⛅',n:'☁️'},3:{d:'Overcast',i:'☁️',n:'☁️'},
    45:{d:'Foggy',i:'🌫️',n:'🌫️'},48:{d:'Icy fog',i:'🌫️',n:'🌫️'},
    51:{d:'Light drizzle',i:'🌦️',n:'🌧️'},53:{d:'Drizzle',i:'🌧️',n:'🌧️'},55:{d:'Heavy drizzle',i:'🌧️',n:'🌧️'},
    56:{d:'Freezing drizzle',i:'🌧️',n:'🌧️'},57:{d:'Freezing drizzle',i:'🌧️',n:'🌧️'},
    61:{d:'Light rain',i:'🌦️',n:'🌧️'},63:{d:'Rain',i:'🌧️',n:'🌧️'},65:{d:'Heavy rain',i:'🌧️',n:'🌧️'},
    66:{d:'Freezing rain',i:'🌧️',n:'🌧️'},67:{d:'Freezing rain',i:'🌧️',n:'🌧️'},
    71:{d:'Light snow',i:'🌨️',n:'🌨️'},73:{d:'Snow',i:'❄️',n:'❄️'},75:{d:'Heavy snow',i:'❄️',n:'❄️'},
    77:{d:'Snow grains',i:'❄️',n:'❄️'},
    80:{d:'Light showers',i:'🌦️',n:'🌧️'},81:{d:'Showers',i:'🌧️',n:'🌧️'},82:{d:'Heavy showers',i:'⛈️',n:'⛈️'},
    85:{d:'Snow showers',i:'🌨️',n:'🌨️'},86:{d:'Heavy snow',i:'❄️',n:'❄️'},
    95:{d:'Thunderstorm',i:'⛈️',n:'⛈️'},96:{d:'Hail storm',i:'⛈️',n:'⛈️'},
    99:{d:'Severe storm',i:'⛈️',n:'⛈️'},
  };
  function wmo(code,isDay){const w=WMO[code]||WMO[0];return{desc:w.d,icon:isDay?w.i:w.n}}

  async function fetchWeather(){
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      +`&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index`
      +`&hourly=temperature_2m,weather_code,precipitation_probability,is_day`
      +`&timezone=Europe%2FAmsterdam&forecast_days=2`;
    const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();
  }

  function render(data){
    const c=data.current, isDay=c.is_day===1, w=wmo(c.weather_code,isDay);

    $('bgPhoto').src=pickPhoto(getPhotoKey(c.weather_code,isDay));
    $('curTemp').innerHTML=`${Math.round(c.temperature_2m)}<sup>°C</sup>`;
    $('curDesc').textContent=w.desc;
    $('curIcon').textContent=w.icon;
    $('curWind').textContent=`${Math.round(c.wind_speed_10m)} km/h`;
    $('curHumidity').textContent=`${c.relative_humidity_2m}%`;
    $('feelsLike').innerHTML=`${Math.round(c.apparent_temperature)}<span class="info-unit">°</span>`;
    $('uvIndex').textContent=c.uv_index!=null?Math.round(c.uv_index):'--';
    $('pressure').innerHTML=`${Math.round(c.surface_pressure)}<span class="info-unit">hPa</span>`;
    const dirs=['N','NE','E','SE','S','SW','W','NW'];
    $('windDir').textContent=dirs[Math.round(c.wind_direction_10m/45)%8];

    const now=new Date();
    $('updateTime').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');

    const h=data.hourly;
    const ci=h.time.findIndex(t=>new Date(t)>=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours()));
    const scroll=$('hourlyScroll');scroll.innerHTML='';

    for(let i=0;i<12;i++){
      const idx=ci+i;if(idx>=h.time.length)break;
      const time=new Date(h.time[idx]);
      const temp=Math.round(h.temperature_2m[idx]);
      const hw=wmo(h.weather_code[idx],h.is_day[idx]===1);
      const rain=h.precipitation_probability?.[idx];
      const card=document.createElement('div');
      card.className='hour-card'+(i===0?' now':'');
      card.innerHTML=`
        <span class="hour-time">${i===0?'Now':String(time.getHours()).padStart(2,'0')+':00'}</span>
        <span class="hour-icon">${hw.icon}</span>
        <span class="hour-temp">${temp}°</span>
        ${rain!=null&&rain>0?`<span class="hour-rain">${rain}%</span>`:'<span class="hour-rain">&nbsp;</span>'}
      `;
      scroll.appendChild(card);
    }
  }

  async function init(){
    try{render(await fetchWeather());$('loader').classList.add('done');$('app').classList.add('show')}
    catch(e){console.error(e);document.querySelector('.ld-sub').textContent=`Failed — retrying…`;setTimeout(init,10000)}
  }
  init();
  setInterval(async()=>{try{render(await fetchWeather())}catch(e){}},600000);
})();
</script>
</body>
</html>
